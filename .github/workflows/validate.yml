name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Presets resolve from main when a repo runs, so a broken one here breaks every repo's Renovate.
      - run: npx --yes --package renovate@44.259.1 -- renovate-config-validator --strict default.json elixir.json elixir-lib.json elixir-app.json renovate.json
